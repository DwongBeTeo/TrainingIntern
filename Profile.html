<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu bản thân</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }
        header, footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px 0;
        }
        section {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        img {
            width: 150px;
            border-radius: 50%;
        }
        article {
            margin-top: 20px;
        }
        ul {
            list-style-type: square;
        }
        a {
            color: #0077cc;
            text-decoration: none;
            margin-right: 10px;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<header>
    <h1>Giới thiệu bản thân</h1>
</header>

<section>
    <img src="https://via.placeholder.com/150" alt="Ảnh đại diện">
    <h2>Trần Đăng Dương</h2>
    <p><strong>Ngày sinh:</strong> 12/05/2003</p>
    <p><strong>Email:</strong> duong@example.com</p>
    <p><strong>Địa chỉ:</strong> TP. Hồ Chí Minh</p>

    <article>
        <h3>Sở thích</h3>
        <ul>
            <li>Chơi game</li>
            <li>Lập trình web</li>
            <li>Nghe nhạc</li>
            <li>Du lịch</li>
        </ul>
    </article>

    <article>
        <h3>Kết nối với tôi</h3>
        <p>
            <a href="https://facebook.com" target="_blank">Facebook</a>
            <a href="https://instagram.com" target="_blank">Instagram</a>
            <a href="https://github.com" target="_blank">GitHub</a>
        </p>
    </article>
</section>

<footer>
    <p>&copy; 2025 Trần Đăng Dương</p>
</footer>

</body>
</html>
